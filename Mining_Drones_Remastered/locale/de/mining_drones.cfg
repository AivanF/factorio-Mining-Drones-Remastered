[mod-setting-description]
af-mining-drones-clean-player=Verschiebt Ihren Inventarinhalt beim Öffnen in die Ausgabe des Depots. Hilfreich, wenn Sie versehentlich Erz nehmen.
af-mining-drones-no-electric-drill=Kann ein Problem für das Mod "Space Exploration" darstellen
af-mining-drones-quality-cascade=Eine höhere Qualität im Rezept eines Depots kostet Ausbeute: jede Stufe liefert diesen Anteil der vorherigen, bei 10 % kommt ungewöhnliches Erz also mit 10 % der normalen Menge und seltenes mit 1 %. Das Erzvorkommen wird trotzdem in voller Höhe verbraucht. Factorios eigene Qualitätskaskade liegt bei 10 %. Ein Depot kann seine eigene Qualität nicht übersteigen, und seine Drohnen müssen der Rezeptqualität entsprechen.
af-mining-drones-cost-mult=Vervielfacht die Kosten aller Zutaten
af-mining-drones-gears=5 Eisenzahnräder zur Abbau-Drohnen-Rezeptur hinzufügen
af-mining-drones-sticks=10 Eisenstangen zur Abbau-Drohnen-Rezeptur hinzufügen
af-mining-drones-steel=Eine Handvoll Stahlplatten zur Abbau-Drohnen-Rezeptur hinzufügen
af-mining-drones-green=Einen elektronischen Schaltkreis zur Abbau-Drohnen-Rezeptur hinzufügen
af-mining-drones-red=Einen fortgeschrittenen Schaltkreis zur Abbau-Drohnen-Rezeptur hinzufügen
af-mining-drones-blue=Eine Recheneinheit zur Abbau-Drohnen-Rezeptur hinzufügen

[mod-description]
Mining_Drones_Remastered=Fügt Bergbaudrohnen und Depots hinzu, die ein großartiges, aber anpassbares Gleichgewicht bieten: robuste Zutaten für die Drohnenrezeptur anstelle von reinem Eisen, normale Verschmutzungsrate, Verwendung von elektrischer Energie und vieles mehr. Alles ist konfigurierbar, schau dir die Mod-Homepage oder die Start- und Karteneinstellungen an. ^_^