[mod-setting-description]
af-mining-drones-clean-player=Moves your inventory content to depot's output on opening it. Helpful when you accidentally take lots of ore.
af-mining-drones-no-electric-drill=It may be a problem for Space Exploration mod
af-mining-drones-quality-cascade=Choosing a higher quality on a depot's recipe costs yield: each tier returns this share of the previous one, so 10% means uncommon ore comes at 10% of normal and rare at 1%. The ore patch is still consumed at the full rate. Factorio's own quality cascade is 10%. A depot cannot exceed its own quality, and its drones must match the recipe quality.
af-mining-drones-cost-mult=Multiplies the cost of all ingredients
af-mining-drones-gears=Add 5 Iron Gear Wheels to Mining Drone recipe
af-mining-drones-sticks=Add 10 Iron Sticks to Mining Drone recipe
af-mining-drones-steel=Add a couple of Steel Plates to Mining Drone recipe
af-mining-drones-green=Add an Electronic Circuit to Mining Drone recipe
af-mining-drones-red=Add an Advanced Circuit to Mining Drone recipe
af-mining-drones-blue=Add a Processing Unit to Mining Drone recipe

[mod-description]
Mining_Drones_Remastered=Adds mining drones and depots providing great yet cusomisable balance: robust drones recipe ingredients instead of pure iron, normal pollution rate, electric energy usage, and much more. Everything is configurable, check out mod Homepage  or startup and map settings ^_^