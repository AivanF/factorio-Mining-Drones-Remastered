[mod-setting-description]
af-mining-drones-clean-player=Mueve el contenido de su inventario a la salida del depósito al abrirlo. Útil cuando accidentalmente tomas mineral.
af-mining-drones-no-electric-drill=Puede ser un problema para el mod "Space Exploration"
af-mining-drones-quality-cascade=Elegir una calidad superior en la receta de un depósito cuesta rendimiento: cada nivel devuelve esta parte del anterior, así que 10% significa que el mineral poco común llega al 10% del normal y el raro al 1%. El yacimiento se sigue consumiendo al ritmo completo. La propia cascada de calidad de Factorio es del 10%. Un depósito no puede superar su propia calidad, y sus drones deben coincidir con la calidad de la receta.
af-mining-drones-cost-mult=Multiplica el costo de todos los ingredientes.
af-mining-drones-gears=Agregar 5 engranajes de hierro a la receta del drone de minería
af-mining-drones-sticks=Agregar 10 palos de hierro a la receta del drone de minería
af-mining-drones-steel=Agregar un par de placas de acero a la receta del drone de minería
af-mining-drones-green=Agregar un circuito electrónico a la receta del drone de minería
af-mining-drones-red=Agregar un circuito avanzado a la receta del drone de minería
af-mining-drones-blue=Agregar una unidad de procesamiento a la receta del drone de minería

[mod-description]
Mining_Drones_Remastered=Añade drones de minería y depósitos que proporcionan un equilibrio excelente pero personalizable: ingredientes sólidos en la receta de los drones en lugar de hierro puro, tasa normal de contaminación, uso de energía eléctrica y mucho más. Todo es configurable, ¡visita la página principal del mod o los ajustes de inicio y mapa! ^_^