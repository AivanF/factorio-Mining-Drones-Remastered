[mod-setting-description]
af-mining-drones-clean-player=Déplace le contenu de votre inventaire vers la sortie du dépôt lors de son ouverture. Utile lorsque vous prenez accidentellement du minerai.
af-mining-drones-no-electric-drill=Cela peut poser un problème pour le mod "Space Exploration"
af-mining-drones-quality-cascade=Choisir une qualité supérieure sur la recette d'un dépôt coûte du rendement : chaque palier rend cette part du précédent, donc 10 % signifie que le minerai inhabituel arrive à 10 % du normal et le rare à 1 %. Le gisement est malgré tout consommé au taux plein. La cascade de qualité de Factorio est elle-même de 10 %. Un dépôt ne peut pas dépasser sa propre qualité, et ses drones doivent correspondre à la qualité de la recette.
af-mining-drones-cost-mult=Multiplie le coût de tous les ingrédients
af-mining-drones-gears=Ajouter 5 engrenages en fer à la recette du drone minier
af-mining-drones-sticks=Ajouter 10 bâtons en fer à la recette du drone minier
af-mining-drones-steel=Ajouter quelques plaques d'acier à la recette du drone minier
af-mining-drones-green=Ajouter un circuit électronique à la recette du drone minier
af-mining-drones-red=Ajouter un circuit avancé à la recette du drone minier
af-mining-drones-blue=Ajouter une unité de traitement à la recette du drone minier

[mod-description]
Mining_Drones_Remastered=Ajoute des drones miniers et des dépôts offrant un équilibre puissant mais personnalisable : ingrédients robustes pour la recette des drones au lieu de fer pur, taux de pollution normal, utilisation de l'énergie électrique, et bien plus encore. Tout est configurable, consultez la page d'accueil du mod ou les paramètres de démarrage et de carte ^_^