[mod-setting-description]
af-mining-drones-clean-player=Przenosi zawartość twojego ekwipunku do wyjścia magazynu po jego otwarciu. Pomocne, gdy przypadkowo zabierzesz rudę.
af-mining-drones-no-electric-drill=Może to stanowić problem dla modu "Space Exploration"
af-mining-drones-quality-cascade=Wybranie wyższej jakości w recepturze składu kosztuje uzysk: każdy poziom zwraca tę część poprzedniego, więc 10% oznacza, że rudy dobrej jakości jest 10% zwykłej, a wyjątkowej 1%. Złoże i tak zużywa się w pełnym tempie. Własna kaskada jakości Factorio to 10%. Skład nie może przekroczyć własnej jakości, a jego drony muszą odpowiadać jakości receptury.
af-mining-drones-cost-mult=Zwielokrotnia koszt wszystkich składników
af-mining-drones-gears=Dodaj 5 żelaznych kół zębatych do receptury górnika
af-mining-drones-sticks=Dodaj 10 żelaznych prętów do receptury górnika
af-mining-drones-steel=Dodaj kilka blach stalowych do receptury górnika
af-mining-drones-green=Dodaj układ elektroniczny do receptury górnika
af-mining-drones-red=Dodaj zaawansowany układ do receptury górnika
af-mining-drones-blue=Dodaj jednostkę przetwarzania do receptury górnika

[mod-description]
Mining_Drones_Remastered=Dodaje drony górnicze i składy, zapewniające wspaniałą, ale dostosowywalną równowagę: wytrzymałe składniki przepisu na górnika zamiast czystego żelaza, normalny wskaźnik zanieczyszczenia, zużycie energii elektrycznej i wiele więcej. Wszystko można dostosować, sprawdź stronę główną moda lub ustawienia na starcie i na mapie. ^_^