[mod-setting-description]
af-mining-drones-clean-player=Перемещает содержимое вашего инвентаря на выход рудника при его открытии. Полезно, когда если вы случайно взяли руду.
af-mining-drones-no-electric-drill=Может быть проблемой для мода Space Exploration
af-mining-drones-quality-cascade=Выбор более высокого качества в рецепте рудника стоит выхода: каждый шаг возвращает эту долю от предыдущего, так что 10% означает, что необычной руды будет 10% от обычной, а редкой — 1%. Рудная залежь при этом тратится полностью. Собственный шаг качества Factorio — 10%. Рудник не может превысить собственное качество, а его дроны должны соответствовать качеству рецепта.
af-mining-drones-cost-mult=Кратно увеличивает стоимость всех ингредиентов
af-mining-drones-gears=Добавить 5 Шестерней к рецепту Дрона-рудокопа
af-mining-drones-sticks=Добавить 10 Железных Прутов к рецепту Дрона-рудокопа
af-mining-drones-steel=Добавить 2 Стальные Балки к рецепту Дрона-рудокопа
af-mining-drones-green=Добавить Электросхему к рецепту Дрона-рудокопа
af-mining-drones-red=Добавить Улучшенную Электросхему к рецепту Дрона-рудокопа
af-mining-drones-blue=Добавить Процессор к рецепту Дрона-рудокопа

[mod-description]
Mining_Drones_Remastered=Добавляет дронов-рудокопов и рудники с прекрасным балансом: адекватные ингредиенты дронов вместо просто железок, нормальный уровень загрязнений, потребление электроэнергии и многое другое. При этом, всё настраивается, проверьте домашнюю страницу мода  или настройки запуска и карты ^_^