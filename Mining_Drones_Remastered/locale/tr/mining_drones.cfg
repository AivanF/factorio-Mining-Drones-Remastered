[mod-setting-description]
af-mining-drones-clean-player=Envanter içeriğinizi açtığınızda depo çıkışına taşır. Yanlışlıkla cevher aldığınızda faydalıdır.
af-mining-drones-no-electric-drill=Space Exploration modu için sorun olabilir
af-mining-drones-quality-cascade=Bir deponun tarifinde daha yüksek nitelik seçmek verimden kaybettirir: her kademe bir öncekinin bu oranını verir, yani %10 seçilirse yaygın olmayan cevher normalin %10'u, nadir cevher ise %1'i kadar gelir. Cevher yatağı yine de tam hızda tüketilir. Factorio'nun kendi nitelik kademelenmesi de %10'dur. Bir depo kendi niteliğini aşamaz ve dronlarının tarif niteliğiyle eşleşmesi gerekir.
af-mining-drones-cost-mult=Tüm bileşenlerin maliyetini çarpar
af-mining-drones-gears=Maden dronu tarifine 5 demir dişli ekle
af-mining-drones-sticks=Maden dronu tarifine 10 demir çubuk ekle
af-mining-drones-steel=Maden dronu tarifine bir çift çelik levha ekle
af-mining-drones-green=Maden dronu tarifine bir elektronik devre ekle
af-mining-drones-red=Maden dronu tarifine bir gelişmiş devre ekle
af-mining-drones-blue=Maden dronu tarifine bir işlem birimi ekle

[mod-description]
Mining_Drones_Remastered=Madencilik dronları ve depolar ekler, sağlam ancak özelleştirilebilir bir denge sağlar: saf demir yerine sağlam dron tarifi içerikleri, normal kirlilik oranı, elektrik enerjisi kullanımı ve daha fazlası. Her şey yapılandırılabilir, mod ana sayfasını veya başlangıç ve harita ayarlarını kontrol edin ^_^