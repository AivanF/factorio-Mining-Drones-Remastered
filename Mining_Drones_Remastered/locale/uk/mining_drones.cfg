[mod-setting-description]
af-mining-drones-clean-player=Переміщує вміст вашого інвентарю на вихід копальні при його відкритті. Корисно, коли ви випадково взяли руду.
af-mining-drones-no-electric-drill=Може бути проблемою для моду Space Exploration
af-mining-drones-quality-cascade=Вибір вищої якості в рецепті рудника коштує виходу: кожен крок повертає цю частку від попереднього, тож 10% означає, що незвичайної руди буде 10% від звичайної, а рідкісної — 1%. Рудний поклад при цьому витрачається повністю. Власний крок якості Factorio — 10%. Рудник не може перевищити власну якість, а його дрони мають відповідати якості рецепту.
af-mining-drones-cost-mult=Кратно збільшує вартість усіх інгредієнтів
af-mining-drones-gears=Додати 5 Шестернів до рецепту Дрона-рудокопа
af-mining-drones-sticks=Додати 10 Залізних Прутів до рецепту Дрона-рудокопа
af-mining-drones-steel=Додати 2 Сталеві Балки до рецепту Дрона-рудокопа
af-mining-drones-green=Додати Електросхему до рецепту Дрона-рудокопа
af-mining-drones-red=Додати Покращену Електросхему до рецепту Дрона-рудокопа
af-mining-drones-blue=Додати Процесор до рецепту Дрона-рудокопа

[mod-description]
Mining_Drones_Remastered=Додає дронів-рудокопів та копальні з чудовим балансом: адекватні інгредієнти дронів замість просто залізниць, нормальний рівень забруднень, споживання електроенергії та багато іншого. При цьому все налаштовується, перевірте домашню сторінку мода або налаштування запуску та карти ^_^